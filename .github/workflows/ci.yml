name: CI

on:
  push:
  pull_request:

jobs:
  nextflow-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Validate config
        run: nextflow config

      - name: Stub pipeline run
        run: nextflow run main.nf -params-file params.yml -stub-run